body{margin:0;background:#000}
a{color:#2997FF;text-decoration:none}a:hover{color:#5AB0FF}
.trace{fill:none;stroke:#18202B;stroke-width:1.5;stroke-linejoin:round}
.pulse{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60 1940;stroke-dashoffset:2000;animation:gh-flow 4.5s cubic-bezier(.55,0,.75,1) infinite;filter:drop-shadow(0 0 6px rgba(41,151,255,.95))}
.core{animation:gh-breathe 2.25s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(41,151,255,.8))}
.via{fill:#000;stroke:#26303D;stroke-width:1.5}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-6px)}
.fork{display:block}
.glass-pill{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 8px 32px rgba(0,0,0,.6),0 0 24px rgba(41,151,255,.18);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
.glass-pill:hover{border-color:rgba(255,255,255,.3)}
.glass-text{background:linear-gradient(110deg,rgba(255,255,255,.62) 0%,#FFFFFF 22%,rgba(255,255,255,.62) 38%,rgba(255,255,255,.62) 62%,#CFE6FF 80%,rgba(255,255,255,.62) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 0 10px rgba(41,151,255,.35));animation:gh-shine 6s ease-in-out infinite}
@keyframes gh-shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes gh-flow{to{stroke-dashoffset:0}}
@keyframes gh-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}.fork{display:none}.hero{height:520px !important}.circuit{transform:scale(.45);transform-origin:50% 0}.hero-copy{top:205px !important}.hero-cue{top:420px !important}.downline{display:none}}
@media (prefers-reduced-motion: reduce){.pulse,.core,.glass-text{animation:none}.pulse{stroke-dasharray:none;opacity:.3}.tile:hover{transform:none}}
</style>
<style>html{scroll-behavior:smooth}</style>
